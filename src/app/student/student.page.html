<ion-header [translucent]="false">
  <ion-toolbar>
    <ion-title>Profil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  @if (loading()) {
    <ion-spinner name="crescent"></ion-spinner>
  } @else if (error()) {
    <p>{{ error() }}</p>
  } @else if (profile(); as p) {
    <ion-card>
      <ion-item lines="none">
        <ion-avatar slot="start">
          <ion-img [src]="p.student.image.link"></ion-img>
        </ion-avatar>
        <ion-label>
          <ion-card-title>{{ p.student.usual_full_name }}</ion-card-title>
          <ion-card-subtitle>{{ p.student.login }}</ion-card-subtitle>
        </ion-label>
      </ion-item>
      <ion-card-content>
        <p>Email: {{ p.student.email }}</p>
        <p>Phone: {{ p.student.phone }}</p>
        <p>Wallet: {{ p.student.wallet }}</p>
        <p>Correction Points: {{ p.student.correction_point }}</p>
      </ion-card-content>
    </ion-card>

    <app-segment [projects]="projects()" [skills]="skills()" />
  }
</ion-content>
